<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Keystone Auto Glass</title>
    <meta name="description" content="Contact Keystone Auto Glass for windshield replacement, repair, and mobile auto glass service in South Central Pennsylvania.">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/site-config.js" defer></script>
    <script src="assets/js/site-loader.js" defer></script>
  </head>
  <body>
    <main class="section">
      <div class="container">
        <p class="eyebrow">Contact</p>
        <h1 data-config-text="business.name"></h1>
        <p data-config-text="business.tagline"></p>
        <p>
          Call: <a data-phone-link><span data-config-text="contact.phoneDisplay"></span></a><br>
          Email: <a data-email-link><span data-config-text="contact.email"></span></a><br>
          Hours: <span data-config-text="contact.hours"></span>
        </p>
        <p><a class="button button-primary" href="index.html#hero-form">Request Service</a></p>
      </div>
    </main>
  </body>
</html>
